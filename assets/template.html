<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>%%PLOT_TITLE%%</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
        }

        /* Main container - full viewport */
        #main-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Timeline Scrubber - compact bar above the graph */
        #timeline-container {
            background: linear-gradient(180deg, #1e1e2e 0%, #151520 100%);
            border-bottom: 1px solid #333;
            padding: 4px 10px;
            flex-shrink: 0;
        }

        /* Controls row */
        #controls-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        #current-time {
            font-size: 12px;
            font-weight: bold;
            color: #00d4ff;
            font-family: 'Consolas', 'Monaco', monospace;
            min-width: 140px;
        }

        #audio-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #audio-controls button {
            background: #2a2a3a;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.15s;
        }

        #audio-controls button:hover {
            background: #3a3a4a;
            border-color: #00d4ff;
        }

        #audio-controls button.active {
            background: #00d4ff;
            color: #111;
        }

        #grid-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #aaa;
        }

        #grid-controls .grid-label {
            font-size: 11px;
            font-weight: 600;
            color: #cfdcff;
        }

        .grid-toggle-button {
            background: #2a2a3a;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.15s;
        }

        .grid-toggle-button:hover {
            background: #3a3a4a;
            border-color: #00d4ff;
        }

        .grid-toggle-button.active {
            background: #00d4ff;
            color: #111;
        }

        #volume-control {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }

        #volume-slider {
            width: 60px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
        }

        #audio-source-select {
            background: #1e1e2e;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
        }

        #total-time {
            font-size: 12px;
            color: #888;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        /* Labeling controls - aligned right for visual separation from playback/grid controls */
        #labeling-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #aaa;
            flex-wrap: wrap;
            margin-left: auto;
        }

        #label-type-select {
            background: #1e1e2e;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
        }

        #labeling-controls button {
            background: #2a2a3a;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.15s;
        }

        #labeling-controls button:hover {
            background: #3a3a4a;
            border-color: #00d4ff;
        }

        /* Timeline scrubber bar */
        #timeline-scrubber {
            position: relative;
            height: 18px;
            background: #1a1a2a;
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
            border: 1px solid #333;
        }

        /* State strip overlays near x-axis */
        #noise-state-strip-plot,
        #cardiac-state-strip-plot,
        #manual-state-strip-plot {
            position: absolute;
            left: 0;
            top: 0;
            width: 1px;
            height: 1px;
            pointer-events: auto;
            opacity: 0.90;
            cursor: crosshair;
        }
        #noise-state-strip-plot {
            z-index: 7;
        }
        #cardiac-state-strip-plot {
            z-index: 6;
        }
        #manual-state-strip-plot {
            z-index: 5;
        }

        .state-strip-tooltip {
            position: fixed;
            background: rgba(18, 18, 32, 0.95);
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            line-height: 1.6;
            color: #ddd;
            white-space: pre-wrap;
            max-width: 340px;
            max-height: min(70vh, calc(100vh - 24px));
            overflow-y: auto;
            pointer-events: none;
            z-index: 200;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }

        .state-strip-tooltip.hidden {
            display: none;
        }

        #timeline-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff44 0%, #00d4ff22 100%);
            pointer-events: none;
        }

        #timeline-playhead {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #00d4ff;
            box-shadow: 0 0 6px #00d4ff;
            pointer-events: none;
        }

        #timeline-ticks {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .timeline-tick {
            position: absolute;
            top: 0;
            width: 1px;
            background: #333;
        }

        .timeline-tick.major {
            height: 100%;
            background: #444;
        }

        .timeline-tick.minor {
            height: 40%;
            top: 60%;
        }

        .tick-label {
            position: absolute;
            top: 1px;
            font-size: 8px;
            color: #666;
            transform: translateX(-50%);
            pointer-events: none;
        }

        /* Chart container - fills remaining space */
        #chart-container {
            flex: 1;
            position: relative;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* Chart toolbar - title, audio filename, legend filter */
        #chart-toolbar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            background: rgba(40, 40, 50, 0.6);
            border-bottom: 1px solid #333;
            font-size: 12px;
        }
        #chart-toolbar .chart-toolbar-title {
            color: #aaa;
            white-space: nowrap;
        }
        #chart-toolbar .chart-toolbar-label {
            color: #aaa;
            white-space: nowrap;
            margin-left: auto;
        }
        #chart-toolbar #audio-file-name {
            font-size: 12px;
            color: #ccc;
            white-space: nowrap;
            flex-shrink: 0;
        }
        #legend-category-filter {
            padding: 2px 6px;
            background: #2a2a35;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }
        #legend-category-filter:hover {
            border-color: #666;
        }
        .chart-toolbar-btn {
            padding: 2px 8px;
            background: #2a2a35;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }
        .chart-toolbar-btn:hover {
            border-color: #666;
        }
        .chart-toolbar-btn.active {
            border-color: #888;
            background: #353545;
        }

        .plotly-chart-wrapper {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        #plotly-chart {
            width: 100%;
            height: 100%;
        }

        #plotly-chart > div {
            width: 100% !important;
            height: 100% !important;
        }

        /* Vertical playhead line on chart */
        #chart-playhead {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #ff4757;
            box-shadow: 0 0 8px #ff4757;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        /* Hidden audio element */
        #audio-player {
            display: none;
        }

        /* Spectrogram overlay */
        #spectrogram-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        #spectrogram-image {
            position: absolute;
            height: 100%;
            opacity: 0.4;
            pointer-events: none;
            image-rendering: auto;
            transition: opacity 0.2s ease;
        }

        #spectrogram-image.hidden {
            opacity: 0;
        }

        /* Keyboard shortcuts hint */
        #shortcuts-hint {
            position: fixed;
            bottom: 8px;
            right: 8px;
            background: rgba(30, 30, 40, 0.85);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 10px;
            color: #777;
            z-index: 1000;
        }

        #shortcuts-hint kbd {
            background: #333;
            padding: 1px 4px;
            border-radius: 2px;
            margin: 0 1px;
            font-size: 9px;
        }

        /* Analysis Summary modal */
        #analysis-summary-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }
        #analysis-summary-overlay.visible {
            display: flex;
        }
        #analysis-summary-modal {
            background: #1e1e2e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 16px;
            max-width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        #analysis-summary-modal h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #00d4ff;
        }
        #analysis-summary-text {
            width: 480px;
            min-height: 120px;
            max-height: 50vh;
            padding: 10px;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            resize: vertical;
        }
        #analysis-summary-modal .modal-close {
            margin-top: 12px;
            align-self: flex-end;
            padding: 6px 14px;
            background: #2a2a3a;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        #analysis-summary-modal .modal-close:hover {
            background: #3a3a4a;
            border-color: #00d4ff;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <!-- Timeline Scrubber - compact bar above graph -->
        <div id="timeline-container">
            <div id="controls-row">
                <span id="current-time">00:00.000 (0.00s)</span>
                <div id="audio-controls">
                    <button id="play-btn" title="Play/Pause (Space)">&#9654; Play</button>
                    <button id="stop-btn" title="Stop (S)">&#9209; Stop</button>
                    <button id="sync-btn" class="active" title="Sync playhead">&#128279;</button>
                    <button id="spectrogram-btn" title="Toggle Spectrogram (G)">&#128202; Spectrogram</button>
                    <div id="spectrogram-controls">
                        <input type="range" id="spectrogram-opacity" min="0.1" max="0.8" step="0.05" value="0.4" title="Spectrogram opacity">
                    </div>
                    <div id="volume-control">
                        <span>&#128266;</span>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
                    </div>
                    %%AUDIO_SOURCE_SELECT%%
                    <button id="analysis-summary-btn" title="View analysis summary (copy-friendly)">&#128203; Analysis Summary</button>
                </div>
                <div id="grid-controls">
                    <span class="grid-label">Grid:</span>
                    <button class="grid-toggle-button" data-grid-axis="yaxis" title="Toggle signal amplitude gridlines">Signal</button>
                    <button class="grid-toggle-button active" data-grid-axis="yaxis2" title="Toggle BPM/HRV gridlines">BPM</button>
                </div>
                <div id="labeling-controls">
                    <span class="grid-label">State:</span>
                    <select id="label-type-select" title="State to place at playhead">
                        <option value="S1">S1</option>
                        <option value="S2">S2</option>
                    </select>
                    <button id="apply-label-btn" title="Place selected state centered on playhead">Apply</button>
                    <button id="flip-labels-right-btn" title="Flip manual S1↔S2 states to the right of the playhead">Flip Right</button>
                    <button id="regenerate-states-btn" title="Show auto labels unchanged until first edit; then fill gaps between S1/S2 anchors with systole/diastole">Regenerate</button>
                    <button id="download-labels-btn" title="Export manual state sequence as CSV">Download CSV</button>
                    <button id="import-labels-btn" title="Import manual state sequence CSV (replaces current)">Import CSV</button>
                    <input type="file" id="import-labels-input" accept=".csv" style="display:none" />
                </div>
                <span id="total-time">%%TOTAL_TIME%%</span>
            </div>
            <div id="timeline-scrubber">
                <div id="timeline-ticks"></div>
                <div id="timeline-progress"></div>
                <div id="timeline-playhead"></div>
            </div>
        </div>

        <!-- Chart container - takes up remaining space -->
        <div id="chart-container">
            <div id="chart-toolbar">
                <span class="chart-toolbar-title">Heartbeat Analysis - </span>
                <span id="audio-file-name" title="%%AUDIO_FILE_NAME%%">%%AUDIO_FILE_NAME%%</span>
                <label for="legend-category-filter" class="chart-toolbar-label">Show:</label>
                <select id="legend-category-filter" title="Filter legend and visible traces by category">
                    <option value="all">All</option>
                    <option value="debug">Debug</option>
                    <option value="analysis">Analysis Data</option>
                </select>
                <label for="pass3-state-view-select" class="chart-toolbar-label">Cardiac strip:</label>
                <select id="pass3-state-view-select" title="Cardiac phase timeline (Pass 3)"></select>
                <button id="hover-toggle-btn" class="chart-toolbar-btn" title="Toggle hover tooltips on/off">S1/S2 Hover info</button>
            </div>
            <div id="spectrogram-container">
                <img id="spectrogram-image" class="hidden" src="%%SPECTROGRAM_SRC%%" alt="Spectrogram" />
            </div>
            <canvas id="noise-state-strip-plot"></canvas>
            <div id="noise-state-strip-tooltip" class="state-strip-tooltip hidden"></div>
            <canvas id="cardiac-state-strip-plot"></canvas>
            <div id="cardiac-state-strip-tooltip" class="state-strip-tooltip hidden"></div>
            <canvas id="manual-state-strip-plot"></canvas>
            <div id="manual-state-strip-tooltip" class="state-strip-tooltip hidden"></div>
            <div id="chart-playhead"></div>
            <div id="plotly-chart">
                %%PLOTLY_HTML%%
            </div>
        </div>
    </div>

    <!-- Hidden audio player -->
    <audio id="audio-player" preload="auto">
        Your browser does not support audio playback.
    </audio>

    <!-- Analysis Summary modal -->
    <div id="analysis-summary-overlay" aria-hidden="true">
        <div id="analysis-summary-modal">
            <h3>Analysis Summary</h3>
            <textarea id="analysis-summary-text" readonly placeholder="No summary data."></textarea>
            <button type="button" class="modal-close" id="analysis-summary-close">Close</button>
        </div>
    </div>

    <!-- Keyboard shortcuts hint -->
    <div id="shortcuts-hint">
        <kbd>Space</kbd> Play &nbsp;
        <kbd>S</kbd> Stop &nbsp;
        <kbd>&#8592;&#8594;</kbd> Seek &nbsp;
        <kbd>G</kbd> Spectrogram &nbsp;
        <kbd>1</kbd>/<kbd>2</kbd> Apply S1/S2 &nbsp;
        <kbd>Del</kbd> Remove state &nbsp;
        <kbd>Ctrl+Z</kbd> Undo
    </div>

%%HTML_INTERACTIVE_SCRIPTS%%
</body>
</html>
